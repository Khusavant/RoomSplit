<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="Room Split — Smart expense splitting for roommates. Track balances, split bills, settle debts with AI-powered insights." />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Room Split — Split the bill, not the friends</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="mesh-bg">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div id="app">
    <!-- SPA content renders here -->
    <div id="splash-loader" class="splash-loader">
      <div class="splash-content">
        <div class="splash-logo">
          <span class="logo-icon">💰</span>
          <h1 class="logo-text">Room<span class="accent">Split</span></h1>
        </div>
        <p class="splash-tagline">Split the bill, not the friends</p>
        <div class="splash-spinner"></div>
      </div>
    </div>
  </div>
  
  <!-- Toast Container -->
  <div id="toast-container"></div>
  
  <!-- Modal Container -->
  <div id="modal-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
